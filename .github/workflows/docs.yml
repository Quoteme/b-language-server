name: Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Write Dokka init script
        run: |
          cat > "$RUNNER_TEMP/dokka.init.gradle.kts" <<'EOF'
          initscript {
              repositories { gradlePluginPortal() }
              dependencies { classpath("org.jetbrains.dokka:dokka-gradle-plugin:2.1.0") }
          }
          rootProject {
              pluginManager.withPlugin("org.jetbrains.kotlin.jvm") {
                  plugins.apply(org.jetbrains.dokka.gradle.formats.DokkaJavadocPlugin::class.java)
                  extensions.configure<org.jetbrains.dokka.gradle.DokkaExtension> {
                      moduleName.set(rootProject.name)
                      dokkaSourceSets.register("main") {
                          sourceRoots.from("src/main/kotlin", "src/main/java")
                          classpath.from(configurations.named("compileClasspath"))
                          jdkVersion.set(17)
                      }
                  }
              }
          }
          EOF
      - run: ./gradlew --init-script "$RUNNER_TEMP/dokka.init.gradle.kts" dokkaGeneratePublicationJavadoc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/javadoc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
